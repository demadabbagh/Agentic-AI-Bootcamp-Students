<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI Bootcamp — Module 3 · ReAct, Planning & Tool-Use</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
/* marker palette — all derived from the theme tokens above */
:root, html[data-theme="dark"] {
  --mk-ink: var(--cp-text);
  --mk-soft: var(--cp-text-muted);
  --mk-red: var(--cp-accent);
  --mk-blue: var(--cp-link);
  --mk-green: var(--cp-success);
  --mk-amber: var(--cp-warning);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}
#stage {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
#board {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  background: var(--cp-bg-elevated);
  background-image:
    linear-gradient(var(--cp-border) 1px, transparent 1px),
    linear-gradient(90deg, var(--cp-border) 1px, transparent 1px);
  background-size: 46px 46px, 46px 46px;
  box-shadow: var(--cp-shadow);
  overflow: hidden;
}
html[data-theme="light"] #board { background-blend-mode: normal; }
#board::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, transparent 55%, var(--cp-sheen) 100%);
  opacity: .5;
}
svg#art { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 68px); }
.hw { font-family: "Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive; }
.mono { font-family: Consolas, "Courier New", Courier, monospace; }
/* chrome */
#bar { position: absolute; left: 0; top: 0; height: 4px; width: 0%; background: var(--cp-accent); transition: width .35s ease; z-index: 5; }
/* fixed bottom tray — content can never reach it, the SVG stops above it */
#tray {
  position: absolute; left: 0; right: 0; bottom: 0; height: 68px; z-index: 6;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 0 16px;
  background: var(--cp-panel-strong);
  border-top: 1px solid var(--cp-border);
}
#hud { font-size: 13px; color: var(--cp-text-soft); display: flex; gap: 10px; align-items: baseline; white-space: nowrap; overflow: hidden; }
#hud b { color: var(--cp-text-muted); font-weight: 600; }
#trayRight { display: flex; align-items: center; gap: 16px; }
#dots { display: flex; gap: 5px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cp-border-strong); opacity: .45; transition: all .25s; }
.dot.on { background: var(--cp-accent); opacity: 1; transform: scale(1.5); }
.dot.seen { opacity: .8; }
#logos {
  display: flex; align-items: center; gap: 14px;
  background: #ffffff; border: 1px solid var(--cp-border);
  border-radius: 0.625rem; padding: 5px 12px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
#logos img { display: block; }
#logos.empty { display: none; }
#logos img { max-height: 46px; max-width: 190px; object-fit: contain; }
#logos .lg-sep { width: 1px; height: 34px; background: var(--cp-border); }
#hint {
  position: absolute; right: 16px; top: 14px; z-index: 5;
  font-size: 12px; color: var(--cp-text-soft); background: var(--cp-panel-strong);
  border: 1px solid var(--cp-border); border-radius: 0.625rem; padding: 6px 10px;
  transition: opacity .6s;
}
#hint.gone { opacity: 0; pointer-events: none; }
#hint kbd { font-family: Consolas, monospace; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
#overview {
  position: absolute; inset: 0; z-index: 10; background: var(--cp-overlay);
  backdrop-filter: blur(6px); display: none; padding: 4vh 4vw; overflow: auto;
}
#overview.on { display: block; }
#overview h2 { margin: 0 0 14px; font-size: 18px; color: var(--cp-text); }
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ocard {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem;
  padding: 10px 12px; cursor: pointer; font-size: 13px; color: var(--cp-text);
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  display: flex; gap: 8px; align-items: baseline;
}
.ocard:hover { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.ocard span { color: var(--cp-text-soft); font-family: Consolas, monospace; font-size: 11px; }
.ocard.cur { border-color: var(--cp-accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <div id="bar"></div>
    <svg id="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="whiteboard"></svg>
    <div id="hint"><kbd>&#8594;</kbd> / click = draw next &nbsp;&#183;&nbsp; <kbd>&#8592;</kbd> back &nbsp;&#183;&nbsp; <kbd>R</kbd> replay &nbsp;&#183;&nbsp; <kbd>O</kbd> map &nbsp;&#183;&nbsp; <kbd>F</kbd> full</div>
    <div id="tray">
      <div id="hud"><b id="hudTitle"></b><span id="hudNum"></span></div>
      <div id="trayRight">
        <div id="dots"></div>
        <div id="logos"></div>
      </div>
    </div>
    <div id="overview"><h2>Slide map — click to jump</h2><div class="ogrid" id="ogrid"></div></div>
  </div>
</div>

/* ============================================================
   1. SKETCH ENGINE — turns geometry into hand-drawn strokes
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const art = document.getElementById("art");
let seedCounter = 1;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const C = c => "var(--mk-" + (c || "ink") + ")";

/* resample + jitter a point list so straight geometry looks drawn by hand */
function rough(pts, seed, amp, close) {
  const r = rng(seed); const out = [];
  const list = close ? pts.concat([pts[0]]) : pts;
  for (let i = 0; i < list.length - 1; i++) {
    const [x1, y1] = list[i], [x2, y2] = list[i + 1];
    const len = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(2, Math.round(len / 16));
    for (let j = 0; j < n; j++) {
      const t = j / n;
      const jx = (r() - .5) * amp * (j === 0 ? .35 : 1);
      const jy = (r() - .5) * amp * (j === 0 ? .35 : 1);
      out.push([x1 + (x2 - x1) * t + jx, y1 + (y2 - y1) * t + jy]);
    }
  }
  const last = list[list.length - 1];
  out.push([last[0] + (r() - .5) * amp * .35, last[1] + (r() - .5) * amp * .35]);
  return out;
}
function toD(pts) { return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "); }

/* animated stroke */
function stroke(d, o) {
  o = o || {};
  const p = mk("path", {
    d, fill: "none", stroke: C(o.color), "stroke-width": o.w || 3,
    "stroke-linecap": "round", "stroke-linejoin": "round", opacity: o.op == null ? 1 : o.op
  });
  if (o.dash) p.setAttribute("stroke-dasharray", "10 9");
  art.appendChild(p);
  const dur = o.dur == null ? 520 : o.dur;
  if (dur <= 0) return p;
  let len = 320; try { len = p.getTotalLength() || 320; } catch (e) {}
  if (o.dash) {
    p.style.opacity = 0;
    p.animate([{ opacity: 0 }, { opacity: o.op == null ? 1 : o.op }], { duration: dur, delay: o.delay || 0, fill: "forwards", easing: "ease-out" });
    return p;
  }

/* handwritten text — fades + settles in */
function text(str, o) {
  o = o || {};
  const lines = String(str).split("\n");
  const g = mk("g", { opacity: 0 });
  const size = o.size || 28, lh = o.lh || size * 1.25;
  const nodes = [];
  lines.forEach((ln, i) => {
    const t = mk("text", {
      x: o.x, y: o.y + i * lh, fill: C(o.color),
      "font-size": size, "text-anchor": o.align || "middle",

        const b = nodes[i].getEndPositionOfChar(idx + o.mark.length - 1);

/* ============================================================
   4. PLAYER
   ============================================================ */
const boardEl = document.getElementById("board");
let si = 0, st = 0, busy = false;

function draw(list, animate) {
  let delay = 0;
  list.forEach((e, i) => {
    const fn = S[e.t];
    if (!fn) return;
    const dur = animate ? (e.dur || 540) : 0;
    fn(e, { dur, delay: animate ? (e.delay != null ? e.delay : delay) : 0 });
    if (animate) delay += (e.gap != null ? e.gap : 170);
  });
}
function titleBlock(s) {
  const items = [{ t: "text", text: s.title, x: 76, y: 92, size: 46, align: "start", color: "ink" }];
  if (s.kicker) items.unshift({ t: "text", text: s.kicker, x: 78, y: 50, size: 20, align: "start", color: "red" });
  items.push({ t: "line", x1: 74, y1: 112, x2: 74 + Math.min(1000, s.title.length * 24), y2: 112, color: "red", w: 4, seed: 91, amp: 2.6, gap: 60 });
  return items;
}
function render(animateLast) {
  art.innerHTML = "";
  const s = SLIDES[si];
  for (let k = 0; k <= st; k++) {
    const animate = animateLast && k === st;
    const list = (k === 0 && !s.bare) ? titleBlock(s).concat(s.steps[0]) : s.steps[k];
    draw(list, animate);
  }
  document.getElementById("hudTitle").textContent = s.title;
  document.getElementById("hudNum").textContent = "  " + (si + 1) + " / " + SLIDES.length + "   \u00b7   build " + (st + 1) + "/" + s.steps.length;
  document.getElementById("bar").style.width = ((si + (st / Math.max(1, s.steps.length - 1 || 1))) / SLIDES.length * 100) + "%";
  document.querySelectorAll("#dots .dot").forEach((d, i) => { d.className = "dot" + (i === si ? " on" : (i < si ? " seen" : "")); });
}
function next() {
  const s = SLIDES[si];
  if (st < s.steps.length - 1) { st++; render(true); }
  else if (si < SLIDES.length - 1) { si++; st = 0; swipe(); render(true); }
}
function prev() {
  if (st > 0) { st--; render(false); }
  else if (si > 0) { si--; st = SLIDES[si].steps.length - 1; swipe(); render(false); }
}
function jump(i) { si = Math.max(0, Math.min(SLIDES.length - 1, i)); st = 0; swipe(); render(true); }
function swipe() { art.animate([{ opacity: .15 }, { opacity: 1 }], { duration: 260, easing: "ease-out" }); }

document.addEventListener("keydown", ev => {
  const ov = document.getElementById("overview");
  if (ev.key === "Escape") { ov.classList.remove("on"); return; }
  if (ov.classList.contains("on") && ev.key.toLowerCase() !== "o") return;
  switch (ev.key) {
    case "ArrowRight": case " ": case "PageDown": case "Enter": ev.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": case "Backspace": ev.preventDefault(); prev(); break;
    case "ArrowDown": ev.preventDefault(); jump(si + 1); break;
    case "ArrowUp": ev.preventDefault(); jump(si - 1); break;
    case "Home": jump(0); break;
    case "End": jump(SLIDES.length - 1); break;
    default:
      const k = ev.key.toLowerCase();
      if (k === "r") { const keep = st; st = 0; render(true); let i = 0; const tick = () => { if (i++ < keep) { st++; render(true); setTimeout(tick, 900); } }; setTimeout(tick, 900); }
      if (k === "o") ov.classList.toggle("on");
      if (k === "f") { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
      if (k === "t") { const cur = document.documentElement.getAttribute("data-theme"); document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark"); render(false); }
  }
});
boardEl.addEventListener("click", ev => {
  if (document.getElementById("overview").classList.contains("on")) return;
  if (ev.clientX < window.innerWidth * .12) prev(); else next();
});
boardEl.addEventListener("contextmenu", ev => { ev.preventDefault(); prev(); });

/* build chrome + go */
(function boot() {
  const lw = document.getElementById("logos");
  const logos = (typeof LOGOS !== "undefined" && LOGOS.length) ? LOGOS : [];
  logos.forEach((L, i) => {
    if (i) lw.appendChild(Object.assign(document.createElement("div"), { className: "lg-sep" }));
    const im = document.createElement("img");
    im.src = L.src; im.alt = L.alt || "";
    if (L.height) im.style.height = L.height + "px";
    lw.appendChild(im);
  });
  if (!logos.length) lw.classList.add("empty");
  const dots = document.getElementById("dots");
  SLIDES.forEach(() => { const d = document.createElement("div"); d.className = "dot"; dots.appendChild(d); });
  const og = document.getElementById("ogrid");
  SLIDES.forEach((s, i) => {
    const c = document.createElement("div"); c.className = "ocard";
    c.innerHTML = "<span>" + String(i + 1).padStart(2, "0") + "</span> " + s.title;
    c.onclick = () => { document.getElementById("overview").classList.remove("on"); jump(i); };
    og.appendChild(c);
  });
  setTimeout(() => { document.getElementById("hint").classList.add("gone"); }, 9000);
  render(true);
})();
